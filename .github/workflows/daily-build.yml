name: Daily Build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: daily-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_cleanup:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (actions/checkout@v7)
        with:
          persist-credentials: false

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4 (docker/login-action@v4)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current date for tagging
        id: date
        run: echo "IMAGE_DATE=$(date +'%d%m%Y')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4 (docker/setup-buildx-action@v4)

      # Push only a mutable candidate tag, scan that exact digest, then promote
      # the scanned digest so consumers never pull an unscanned `latest`.
      - name: Build and push candidate image
        id: build_and_push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7 (docker/build-push-action@v7)
        with:
          context: .
          build-args: RUNTIME_APT_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          push: true
          tags: ghcr.io/${{ github.repository }}:candidate
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the exact candidate digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (aquasecurity/trivy-action@v0)
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build_and_push.outputs.digest }}
          scanners: vuln
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          vuln-type: 'os,library'
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the scanned digest without rebuilding
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build_and_push.outputs.digest }}
        run: |
          docker buildx imagetools create --prefer-index=false             --tag "$IMAGE:latest" --tag "$IMAGE:$GITHUB_SHA" --tag "$IMAGE:$IMAGE_DATE"             "$IMAGE@$DIGEST"
          for tag in latest "$GITHUB_SHA" "$IMAGE_DATE"; do
            actual=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{.Manifest.Digest}}')
            test "$actual" = "$DIGEST"
          done
          echo "Published $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
